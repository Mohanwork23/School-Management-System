name: Container security scan

on:
  push:
    branches: [ main, daily ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.10.5
        with:
          version: '0.45.0'

      - name: Build image for scanning
        run: |
          docker build -t school-management-system:scan .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.10.5
        with:
          image-ref: school-management-system:scan
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
