spring.application.name=SMS
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.profiles.default=dev
app.version=${project.version}
git.commit=${git.commit.id.abbrev}

# JWT_SECRET must be a random value with at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.documents.max-size-bytes=5242880
app.documents.allowed-content-types=application/pdf,image/jpeg,image/png


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
